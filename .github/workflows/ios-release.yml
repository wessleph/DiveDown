# Signed iOS build to TestFlight (ADR 0005, security.md G6/A3).
#
# Runs on a release tag, by hand, and once a month so no TestFlight build
# expires (90 days). Never on pull requests. The job waits in the `release`
# environment until the owner approves it; the signing secrets live only in
# that environment. Rules W1-W9: test/tool/workflow_policy_test.dart.
name: iOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    name: Build, sign and upload to TestFlight
    environment: release
    if: github.repository == 'wessleph/DiveDown' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0 # build number = commit count

      - name: Select Xcode 26
        run: tool/ci/select_xcode.sh
      - name: Install Flutter
        run: tool/ci/install_flutter.sh
      - run: flutter pub get

      # Temporary keychain and profile, removed again in the last step.
      - name: Install signing certificate and profile
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profile="$RUNNER_TEMP/divedown.mobileprovision"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          rm -f "$profile"
          {
            echo "FLUTTER_XCODE_DIVEDOWN_TEAM_ID=$team"
            echo "FLUTTER_XCODE_DIVEDOWN_PROFILE_NAME=$name"
          } >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Clear dict' \
            -c 'Add :method string app-store-connect' \
            -c 'Add :signingStyle string manual' \
            -c "Add :teamID string $team" \
            -c 'Add :signingCertificate string Apple Distribution' \
            -c 'Add :provisioningProfiles dict' \
            -c "Add :provisioningProfiles:io.github.wessleph.divedown string $name" \
            -c 'Add :manageAppVersionAndBuildNumber bool false' \
            "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build IPA
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count HEAD)"
          echo "Build number $build_number from $GITHUB_SHA"
          flutter build ipa --release \
            --build-number="$build_number" \
            --dart-define=GIT_SHA="$GITHUB_SHA" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$keys/AuthKey_$ASC_KEY_ID.p8"
          ipa="$(ls build/ios/ipa/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          rm -f "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
