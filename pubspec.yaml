name: divedown
description: "Tauch-Logbuch für iOS und Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

# New dependencies only with a checked, GPL-3-compatible licence
# (constitution, rule 4). Versions follow Submersion where possible (ADR 0005).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.2 # Apache-2.0, injectable now() for tests
  drift: ^2.35.3 # MIT (ADR 0004)
  file_picker: ^13.4.0 # MIT (platform packages MIT; cross_file, win32 BSD-3; dbus MPL-2.0, Linux only)
  fit_tool: ^1.0.5 # BSD-3-Clause, unmaintained since 2022 (security R3), pure Dart; pulls in csv, logger (MIT)
  flutter_riverpod: ^3.4.2 # MIT
  go_router: ^17.0.1 # BSD-3-Clause
  intl: any # BSD-3-Clause, version pinned by flutter_localizations
  libdivecomputer_plugin: # GPL-3.0, taken over from Submersion (ADR 0002)
    path: packages/libdivecomputer_plugin
  logger: ^1.4.0 # MIT, already pulled in by fit_tool; silences its warnings
  path: ^1.9.0 # BSD-3-Clause, already pulled in by Flutter
  path_provider: ^2.1.6 # BSD-3-Clause (incl. platform packages), database folder
  permission_handler: ^13.0.2 # MIT (incl. 5 platform packages), BLE runtime permissions (security.md §4)
  sqlite3: ^3.5.1 # MIT, bundles SQLite via build hooks (no SQLCipher, security R4)
  uuid: ^4.5.0 # MIT (ADR 0004)
  url_launcher: ^6.3.3 # BSD-3 (incl. platform packages), links under „Über DiveDown“ (ui-spec §5.11)
  package_info_plus: ^10.2.2 # BSD-3 (http 1.6.0 BSD-3, web/win32/ffi BSD-3), version and build (ui-spec §5.11)

dev_dependencies:
  build_runner: ^2.10.4 # BSD-3-Clause
  drift_dev: ^2.35.2 # MIT
  fake_async: ^1.3.3 # Apache-2.0, already pulled in by flutter_test; T5.7
  flutter_test:
    sdk: flutter
  integration_test: # BSD-3-Clause, part of the Flutter SDK; T4.5 on the phone
    sdk: flutter
  flutter_lints: ^6.0.0
  xml: ^7.0.1 # MIT (petitparser MIT), already pulled in by file_picker; reads Info.plist (I1-I6)
  yaml: ^3.1.4 # MIT (source_span, string_scanner BSD-3), already transitive; workflow policy (W1-W9)

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/dive_sites.json.gz
    - assets/data/dive_sites.version
  # Manrope (SIL OFL 1.1), googlefonts/manrope commit 468c0db, ui-spec §1.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
