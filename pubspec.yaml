name: divedown
description: "Tauch-Logbuch für iOS und Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

# New dependencies only with a checked, GPL-3-compatible licence
# (constitution, rule 4). Versions follow Submersion where possible (ADR 0005).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.2 # Apache-2.0, injectable now() for tests
  drift: ^2.35.3 # MIT (ADR 0004)
  flutter_riverpod: ^3.4.2 # MIT
  go_router: ^17.0.1 # BSD-3-Clause
  intl: any # BSD-3-Clause, version pinned by flutter_localizations
  libdivecomputer_plugin: # GPL-3.0, taken over from Submersion (ADR 0002)
    path: packages/libdivecomputer_plugin
  path: ^1.9.0 # BSD-3-Clause, already pulled in by Flutter
  path_provider: ^2.1.6 # BSD-3-Clause (incl. platform packages), database folder
  sqlite3: ^3.5.1 # MIT, bundles SQLite via build hooks (no SQLCipher, security R4)
  uuid: ^4.5.0 # MIT (ADR 0004)

dev_dependencies:
  build_runner: ^2.10.4 # BSD-3-Clause
  drift_dev: ^2.35.2 # MIT
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
